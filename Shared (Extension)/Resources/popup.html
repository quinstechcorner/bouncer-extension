<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 270px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      margin: 0;
      padding: 14px;
      background-color: #f6f6f8;
      color: #1c1c1e;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-primary {
      background-color: #007aff;
      color: white;
      margin-bottom: 10px;
    }
    .btn-primary:hover { background-color: #0062cc; }
    .btn-secondary {
      background-color: #e5e5ea;
      color: #1c1c1e;
      margin-top: 6px;
    }
    .btn-secondary:hover { background-color: #d1d1d6; }
    label {
      font-size: 11px;
      font-weight: 500;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }
    textarea {
      width: 93%;
      height: 100px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: none;
      background: #ffffff;
      color: #1c1c1e;
    }
    textarea:focus {
      outline: none;
      border-color: #007aff;
    }
    .status {
      font-size: 11px;
      color: #34c759;
      text-align: center;
      margin-top: 6px;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>🛡️ Bouncer</h3>
  </div>

  <button id="blockCurrentBtn" class="btn-primary">🚫 Block Current Site</button>
  
  <label for="domainList">Blocklist (one per line):</label>
  <textarea id="domainList" placeholder="example.com&#10;reddit.com"></textarea>
  
  <button id="saveBtn" class="btn-secondary">Save & Apply</button>
  <div id="statusMsg" class="status">Applied!</div>

  <script src="popup.js"></script>
</body>
</html>
